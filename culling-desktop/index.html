<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select EA</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #08090d;
        color: #f8f9fc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      @keyframes loaderSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulseRec {
        from { transform: scale(0.9); opacity: 0.8; }
        to { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Tela de Carregamento Instantânea (Exibida enquanto o React/Electron inicializa em segundo plano) -->
      <div style="background: radial-gradient(circle at center, #151822 0%, #06070a 100%); position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
        <div style="position: relative; width: 120px; height: 120px; margin-bottom: 20px;">
          <img src="./logo.png" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(250, 1, 34, 0.5));" alt="Select EA" />
          <div style="position: absolute; top: 32px; right: 24px; width: 14px; height: 14px; background: #fa0122; border-radius: 50%; box-shadow: 0 0 14px #fa0122; animation: pulseRec 1.2s infinite alternate;"></div>
        </div>
        <h1 style="font-size: 24px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; color: #fff;">
          SELECT <span style="color: #fa0122; text-shadow: 0 0 16px rgba(250, 1, 34, 0.6);">EA</span>
        </h1>
        <p style="font-size: 11px; font-weight: 500; color: #9ea5bd; letter-spacing: 1.2px; margin-bottom: 24px;">
          CARREGANDO ESTÚDIO DE FOTOS...
        </p>
        <div style="width: 180px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #fa0122, #ff4d63); animation: loaderSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; box-shadow: 0 0 10px #fa0122;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
